<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>モンスト貫通壁ガイド Ver.9 壁位置再調整版</title><style>*{box-sizing:border-box}body{margin:0;background:#0e1728;color:#f1f5ff;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}main{max-width:740px;margin:auto;padding:15px}h1{font-size:21px;margin:8px 0}p{color:#c3cede;line-height:1.5}section{background:#1b2b43;border:1px solid #344761;border-radius:13px;padding:12px;margin:12px 0}button,input[type=file]{font:inherit}button{border:1px solid #61738d;background:#2b4362;color:white;border-radius:9px;padding:10px;margin:3px;cursor:pointer}button.active{background:#147db0;border-color:#75dcff}.primary{background:#087d5d}label{display:block;margin:9px 0}input[type=range]{width:100%}#canvas{width:100%;height:auto;display:block;touch-action:none;border:1px solid #61738d;background:#08111e}#status{font-size:13px;color:#ffe1a0;white-space:pre-wrap}.flex{display:flex;align-items:center;flex-wrap:wrap;gap:5px}.small{font-size:12px;color:#aabbd0}strong{color:white}</style></head><body><main><h1>モンスト 貫通壁反射ガイド Ver.9 壁位置再調整版</h1><p>通常のスクショからキャラの円形マーカーを探します。推定に失敗した場合はタップで修正できます。</p><section><label>① スクリーンショット <input id="pick" type="file" accept="image/*"></label><div id="status">画像を選んでください。</div><div class="flex"><button id="auto" class="primary">キャラ候補を再検出</button><button id="manual">手動で中心を指定</button></div><div id="candidates" class="flex"></div><div class="small">検出した候補を番号で選択。赤い十字が中心です。ガイドなし画像でも動作を試みます。</div></section><section><canvas id="canvas" width="709" height="1536"></canvas><div class="flex"><button id="character">中心を修正</button><button id="angle" class="active">角度を調整</button><button id="wall">壁を調整</button></div><div id="hint" class="small">画像を読み込んでください。</div></section><section><label>反射回数 <b id="bounceVal">8</b><input id="bounces" type="range" min="1" max="20" value="8"></label><label>発射角度 <b id="angleVal">-65.0°</b><input id="angleRange" type="range" min="-180" max="180" step="0.1" value="-65"></label><div class="flex"><button data-step="-1">−1°</button><button data-step="-0.1">−0.1°</button><button data-step="0.1">＋0.1°</button><button data-step="1">＋1°</button></div><div class="flex"><button id="reset">壁を固定値に戻す</button><button id="save" class="primary">ガイド画像を保存</button></div><div id="wallinfo" class="small"></div></section><p class="small">円形マーカーを使った画像処理による推定です。文字・エフェクト・敵を誤検出することがあります。壁座標は参考画像から推定した暫定補正値です。実際の反射点との一致は未検証です。敵・ブロック・減速は未対応です。</p></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),canvas=$('canvas'),ctx=canvas.getContext('2d');let img=null,W=709,H=1536,mode='angle',character=null,angle=-65,bounces=8,walls=null,first=null,drag=false,candidates=[];const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));function preset(w,h){let q=w/h;if(q<.58)return {l:w*32/709,r:w*677/709,t:h*280/1536,b:h*1055/1536};if(q>.70&&q<.87)return {l:w*32/710,r:w*678/710,t:h*119.4/898,b:h*860.3/898};return {l:w*.025,r:w*.975,t:h*.13,b:h*.95}}function wallInfo(){$('wallinfo').textContent=`壁：左 ${walls.l.toFixed(1)} / 右 ${walls.r.toFixed(1)} / 上 ${walls.t.toFixed(1)} / 下 ${walls.b.toFixed(1)} px`}function setMode(m){mode=m;first=null;for(const id of ['character','angle','wall'])$(id).classList.toggle('active',id===m);$('hint').textContent=m==='character'?'キャラクターの中心をタップしてください。':m==='wall'?'左上と右下の壁交点を順にタップしてください。':'画面をドラッグして発射方向を設定してください。';draw()}function trace(){if(!character)return [];let x=clamp(character.x,walls.l+1e-4,walls.r-1e-4),y=clamp(character.y,walls.t+1e-4,walls.b-1e-4),a=angle*Math.PI/180,dx=Math.cos(a),dy=Math.sin(a),p=[{x,y}];for(let n=0;n<bounces;n++){let tx=dx>1e-9?(walls.r-x)/dx:dx< -1e-9?(walls.l-x)/dx:Infinity,ty=dy>1e-9?(walls.b-y)/dy:dy< -1e-9?(walls.t-y)/dy:Infinity,t=Math.min(tx>1e-7?tx:Infinity,ty>1e-7?ty:Infinity);if(!isFinite(t))break;x=clamp(x+dx*t,walls.l,walls.r);y=clamp(y+dy*t,walls.t,walls.b);p.push({x,y});if(Math.abs(tx-ty)<1e-5){dx=-dx;dy=-dy}else if(tx<ty)dx=-dx;else dy=-dy;x=clamp(x+dx*1e-4,walls.l+1e-5,walls.r-1e-5);y=clamp(y+dy*1e-4,walls.t+1e-5,walls.b-1e-5)}return p}function draw(){ctx.clearRect(0,0,W,H);if(img)ctx.drawImage(img,0,0,W,H);else{ctx.fillStyle='#091729';ctx.fillRect(0,0,W,H);ctx.fillStyle='white';ctx.font='24px sans-serif';ctx.fillText('画像を読み込んでください',W*.15,H*.45)}if(!walls)return;ctx.save();ctx.strokeStyle='#ffe477';ctx.lineWidth=Math.max(2,W/280);ctx.setLineDash([W/55,W/110]);ctx.strokeRect(walls.l,walls.t,walls.r-walls.l,walls.b-walls.t);ctx.setLineDash([]);let pts=trace();if(pts.length>1){ctx.strokeStyle='#53e4ff';ctx.lineWidth=Math.max(3,W/150);ctx.beginPath();pts.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.stroke();pts.slice(1).forEach((p,i)=>{ctx.beginPath();ctx.arc(p.x,p.y,Math.max(9,W/58),0,2*Math.PI);ctx.fillStyle='#ffe477';ctx.fill();ctx.fillStyle='#10213a';ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`bold ${Math.max(12,W/48)}px sans-serif`;ctx.fillText(i+1,p.x,p.y)})}if(character){let r=W/38;ctx.strokeStyle='#ff4848';ctx.lineWidth=Math.max(3,W/160);ctx.beginPath();ctx.arc(character.x,character.y,r,0,2*Math.PI);ctx.moveTo(character.x-r*1.5,character.y);ctx.lineTo(character.x+r*1.5,character.y);ctx.moveTo(character.x,character.y-r*1.5);ctx.lineTo(character.x,character.y+r*1.5);ctx.stroke()}if(first){ctx.fillStyle='yellow';ctx.beginPath();ctx.arc(first.x,first.y,10,0,2*Math.PI);ctx.fill()}ctx.restore()}function pos(e){let r=canvas.getBoundingClientRect();return{x:clamp((e.clientX-r.left)*W/r.width,0,W),y:clamp((e.clientY-r.top)*H/r.height,0,H)}}function sync(){$('angleRange').value=angle;$('angleVal').textContent=angle.toFixed(1)+'°';$('bounceVal').textContent=bounces}function moveAngle(p){if(!character)return;let dx=p.x-character.x,dy=p.y-character.y;if(Math.hypot(dx,dy)<3)return;angle=Math.atan2(dy,dx)*180/Math.PI;sync();draw()}
// No guide needed: find roughly circular, high-contrast character markers using a radial edge score.
// Multi-radius edge consistency and local contrast help, but cannot guarantee character identity.
function detectCharacters(){if(!img)return;const sw=Math.min(420,W),scale=sw/W,sh=Math.round(H*scale),off=document.createElement('canvas');off.width=sw;off.height=sh;const oc=off.getContext('2d',{willReadFrequently:true});oc.drawImage(img,0,0,sw,sh);const data=oc.getImageData(0,0,sw,sh).data;let lum=new Float32Array(sw*sh),sat=new Float32Array(sw*sh);for(let i=0;i<sw*sh;i++){let r=data[4*i],g=data[4*i+1],b=data[4*i+2];lum[i]=.299*r+.587*g+.114*b;sat[i]=Math.max(r,g,b)-Math.min(r,g,b)}function sample(x,y){x=Math.round(x);y=Math.round(y);if(x<1||y<1||x>=sw-1||y>=sh-1)return null;return y*sw+x}const x0=Math.max(16,Math.round(walls.l*scale+14)),x1=Math.min(sw-16,Math.round(walls.r*scale-14)),y0=Math.max(20,Math.round(walls.t*scale+18)),y1=Math.min(sh-18,Math.round(walls.b*scale-18));let raw=[];const step=5,radii=[12,16,20,24,28].map(v=>v*sw/420);for(let y=y0;y<y1;y+=step)for(let x=x0;x<x1;x+=step){let best=-1,bestR=0;for(let radius of radii){let edges=0,good=0,inside=0,outside=0,valid=0,quad=[0,0,0,0];for(let k=0;k<24;k++){let a=k*Math.PI/12,ux=Math.cos(a),uy=Math.sin(a),ii=sample(x+ux*(radius-3),y+uy*(radius-3)),oo=sample(x+ux*(radius+3),y+uy*(radius+3));if(ii===null||oo===null)continue;let delta=Math.abs(lum[ii]-lum[oo])+.28*Math.abs(sat[ii]-sat[oo]);edges+=delta;good+=delta>36?1:0;inside+=lum[ii];outside+=lum[oo];quad[Math.floor(k/6)]++;valid++}if(valid<22||good<13)continue;let score=edges/valid+good*1.8;if(score>best){best=score;bestR=radius}}if(best>65)raw.push({x,y,r:bestR,score:best})}raw.sort((a,b)=>b.score-a.score);let picked=[];for(let p of raw){if(picked.every(q=>Math.hypot(q.x-p.x,q.y-p.y)>Math.max(18,p.r*.95))){picked.push(p);if(picked.length>=8)break}}candidates=picked.map(p=>({x:p.x/scale,y:p.y/scale,score:p.score}));let area=$('candidates');area.replaceChildren();candidates.forEach((p,i)=>{let b=document.createElement('button');b.textContent=`候補${i+1}`;b.onclick=()=>{character={x:p.x,y:p.y};$('status').textContent=`候補${i+1}を選択しました。赤い十字が中心に合っているか確認してください。`;setMode('angle')};area.appendChild(b)});if(candidates.length){character={x:candidates[0].x,y:candidates[0].y};$('status').textContent=`${candidates.length}件の円形候補を検出しました。候補1を仮選択しました。赤い十字が違う場合は別の候補か手動指定を選んでください。`;setMode('angle')}else{character=null;$('status').textContent='円形候補を検出できませんでした。中心をタップして指定してください。';setMode('character')}draw()}
canvas.addEventListener('pointerdown',e=>{if(!img)return;e.preventDefault();let p=pos(e);if(mode==='character'){character=p;$('status').textContent='中心を手動指定しました。';setMode('angle')}else if(mode==='angle'){if(!character)return;drag=true;canvas.setPointerCapture(e.pointerId);moveAngle(p)}else if(!first){first=p;$('hint').textContent='右下の交点をタップしてください。';draw()}else{let l=Math.min(first.x,p.x),r=Math.max(first.x,p.x),t=Math.min(first.y,p.y),b=Math.max(first.y,p.y);if(r-l>W*.25&&b-t>H*.2){walls={l,r,t,b};wallInfo();setMode('angle')}else $('hint').textContent='範囲が狭すぎます。もう一度指定してください。';first=null;draw()}});canvas.addEventListener('pointermove',e=>{if(drag&&mode==='angle'){e.preventDefault();moveAngle(pos(e))}});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>canvas.addEventListener(ev,()=>drag=false));$('pick').onchange=e=>{let f=e.target.files?.[0];if(!f)return;let url=URL.createObjectURL(f),next=new Image();next.onload=()=>{img=next;W=next.naturalWidth;H=next.naturalHeight;canvas.width=W;canvas.height=H;walls=preset(W,H);character=null;wallInfo();draw();URL.revokeObjectURL(url);$('status').textContent='画像を読み込みました。キャラ候補を解析しています…';setTimeout(detectCharacters,40)};next.onerror=()=>{$('status').textContent='画像の読み込みに失敗しました。';URL.revokeObjectURL(url)};next.src=url};$('auto').onclick=detectCharacters;$('manual').onclick=()=>setMode('character');$('character').onclick=()=>setMode('character');$('angle').onclick=()=>setMode('angle');$('wall').onclick=()=>setMode('wall');$('bounces').oninput=e=>{bounces=+e.target.value;sync();draw()};$('angleRange').oninput=e=>{angle=+e.target.value;sync();draw()};document.querySelectorAll('[data-step]').forEach(b=>b.onclick=()=>{angle=Math.round(clamp(angle+Number(b.dataset.step),-180,180)*10)/10;sync();draw()});$('reset').onclick=()=>{if(!img)return;walls=preset(W,H);wallInfo();setMode('angle')};$('save').onclick=()=>{if(!img)return;let a=document.createElement('a');a.download='monst-guide-v9-wallfix.png';a.href=canvas.toDataURL('image/png');a.click()};walls=preset(W,H);wallInfo();sync();draw()})();
</script></body></html>
